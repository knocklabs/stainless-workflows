name: 'Publish OpenAPI spec and refreshed Stainless config to an stlc config repo'
description: |
  Publishes a release's OpenAPI spec to an stlc config repo together with a
  refreshed Stainless config, as one PR. After the caller has downloaded the
  spec, this action:
  - Installs the stlc CLI (only the CLI: `stlc autoconfig` never loads the
    per-language generators, so no language toolchains are needed).
  - Clones the config repo's `main` and copies the spec into its workspace.
  - Runs `stlc autoconfig`, first pruning the endpoints listed in the config's
    `unspecified_endpoints` from a spec copy (autoconfig 0.3.x ignores that
    list and would re-add them every run). A failure fails the step: publishing
    a spec without its config is how new endpoints silently never reach the SDKs.
  - Commits spec and config to `<source>-spec-update` and force-pushes it.
  - Opens or refreshes the PR titled "feat: update <spec-label> spec to <tag>".
  - Arms auto-merge ONLY when the config did not change. Otherwise the PR body
    carries autoconfig's "new methods" summary, a review checklist and (if
    existing lines were rewritten) a warning, auto-merge is disabled, and the
    config repo's CODEOWNERS requests the owning team.
  Needs jq on the runner (yq is installed if missing).

inputs:
  config-repo:
    description: 'The stlc config repo, e.g. "knocklabs/stainless-knock-api".'
    required: true
  spec-file:
    description: 'Path, on the runner, of the OpenAPI spec the caller downloaded (e.g. "openapi.json"). Must match the download step''s output.'
    required: true
  source:
    description: 'Short name of the calling service repo (e.g. "switchboard", "control"). Drives the branch name `<source>-spec-update`.'
    required: true
  spec-label:
    description: >-
      Label for the commit subject and PR title, "feat: update <spec-label>
      spec to <tag>" (e.g. "api", "mapi"); <tag> is the calling workflow's
      ref name, i.e. the release tag on a release event. The title becomes
      the commit subject on the SDK repos, which release-please reads, so it
      stays a conventional commit; a reviewer retitles to `feat!:` for a
      major bump.
    required: true
  stlc-repo-token:
    description: >-
      PAT with Contents: write and Pull requests: write on the config repo,
      used to push the branch and open/merge the PR. A PAT, not GITHUB_TOKEN:
      a merge attributed to GITHUB_TOKEN would not trigger the config repo's
      codegen workflow.
    required: true
  stlc-read-token:
    description: 'PAT with Contents: read on stainless/stlc* repos, used to install the stlc CLI.'
    required: true
  workspace:
    description: 'Path of the stlc workspace inside the config repo (contains workspace.json).'
    required: false
    default: 'stainless'

outputs:
  has-changes:
    description: '"true" when the spec or the config differ from the config repo''s main (a PR was pushed).'
    value: ${{ steps.changes.outputs.has-changes }}
  config-changed:
    description: '"true" when `stlc autoconfig` changed the config.'
    value: ${{ steps.autoconfig.outputs.changed }}
  non-additive:
    description: >-
      "true" when the config diff also removes or rewrites existing lines.
      autoconfig only adds mappings, so this means a guessed name collided with
      an existing method (repointing it at a different endpoint). Flagged in
      the PR body.
    value: ${{ steps.autoconfig.outputs.non-additive }}
  summary:
    description: 'The "+ client.<resource>.<method>(...) // <endpoint>" lines autoconfig printed; empty when nothing was added.'
    value: ${{ steps.autoconfig.outputs.summary }}
  pr-url:
    description: 'URL of the spec PR; empty when there was nothing to publish.'
    value: ${{ steps.pr.outputs.pr-url }}
  auto-merge:
    description: '"armed" (auto-merge enabled), "held" (config changed, left for review), "merged" (direct-merge fallback), "failed" (could not arm or merge), or empty when no PR.'
    value: ${{ steps.pr.outputs.auto-merge }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install the stlc CLI
      # Mirrors the config repos' setup-stlc action, minus the language
      # toolchains and generator packages: autoconfig needs the CLI only.
      shell: bash
      env:
        STLC_READ_TOKEN: ${{ inputs.stlc-read-token }}
      run: |
        git_config_key="url.https://x-access-token:${STLC_READ_TOKEN}@github.com/stainless/.insteadOf"
        cleanup_stlc_auth() { git config --global --unset-all "$git_config_key" || true; }
        trap cleanup_stlc_auth EXIT
        git config --global --add "$git_config_key" "https://github.com/stainless/"
        npm install -g "git+https://x-access-token:${STLC_READ_TOKEN}@github.com/stainless/stlc.git"
        stlc version

    - name: Ensure jq and yq
      shell: bash
      run: |
        command -v jq >/dev/null || { echo "::error::jq is required on the runner"; exit 1; }
        if ! command -v yq >/dev/null; then
          echo "yq not found on this runner; installing mikefarah/yq v4.44.3"
          sudo curl -fsSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
        fi

    - name: Clone the config repo and copy the spec in
      id: clone
      shell: bash
      env:
        REPO: ${{ inputs.config-repo }}
        TOKEN: ${{ inputs.stlc-repo-token }}
        SPEC_FILE: ${{ inputs.spec-file }}
        WORKSPACE: ${{ inputs.workspace }}
      run: |
        [ -f "$SPEC_FILE" ] || { echo "::error::spec file not found: $SPEC_FILE"; exit 1; }
        dir="$RUNNER_TEMP/stlc-config-repo"
        rm -rf "$dir"
        git clone --quiet --branch main "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "$dir"
        # Same bot identity every Knock stlc workflow commits with.
        git -C "$dir" config user.name "knock-eng-bot"
        git -C "$dir" config user.email "ops-development@knock.app"
        # The workspace declares the spec filename (workspace.json); copy the
        # artifact as-is over it — no format conversion.
        spec=$(jq -r .openapi_spec "$dir/$WORKSPACE/workspace.json")
        cp "$SPEC_FILE" "$dir/$WORKSPACE/$spec"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    - name: Refresh the Stainless config with stlc autoconfig
      id: autoconfig
      shell: bash
      working-directory: ${{ steps.clone.outputs.dir }}/${{ inputs.workspace }}
      run: |
        spec=$(jq -r .openapi_spec workspace.json)
        cfg=$(jq -r .stainless_config workspace.json)
        echo "config-file=$cfg" >> "$GITHUB_OUTPUT"
        pruned="$RUNNER_TEMP/pruned.openapi.json"

        # WORKAROUND for an upstream stlc bug (0.3.x): unlike the Stainless SaaS,
        # `stlc autoconfig` ignores `unspecified_endpoints` and would re-propose
        # every excluded endpoint on each run, making "config unchanged" (and so
        # auto-merge) unreachable. Prune them from a spec copy first; the real
        # spec is what gets committed.
        jq --argjson drop "$(yq -o=json '.unspecified_endpoints // []' "$cfg")" '
          reduce ($drop[] | split(" ")) as [$m, $p] (.;
            del(.paths[$p][$m])
            | if (.paths[$p] | type == "object" and length == 0) then del(.paths[$p]) else . end)' \
          "$spec" > "$pruned"

        stlc autoconfig --spec "$pruned" --config "$cfg" | tee "$RUNNER_TEMP/autoconfig-summary.txt"

        diff_file="$RUNNER_TEMP/autoconfig.diff"
        git diff -- "$cfg" > "$diff_file"
        if [ -s "$diff_file" ]; then changed=true; else changed=false; fi
        if grep -qE '^-[^-]' "$diff_file"; then non_additive=true; else non_additive=false; fi
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
        echo "non-additive=$non_additive" >> "$GITHUB_OUTPUT"
        {
          echo "summary<<STLC_AUTOCONFIG_EOF"
          grep -E '^\+ client\.' "$RUNNER_TEMP/autoconfig-summary.txt" || true
          echo "STLC_AUTOCONFIG_EOF"
        } >> "$GITHUB_OUTPUT"

        echo "Stainless config changed: $changed (non-additive: $non_additive)"
        if [ "$non_additive" = true ]; then
          echo "::warning::stlc autoconfig removed or rewrote existing config lines — a guessed name probably collided with an existing method. Removed lines:"
          grep -E '^-[^-]' "$diff_file" || true
        fi

    - name: Check for changes to publish
      id: changes
      shell: bash
      working-directory: ${{ steps.clone.outputs.dir }}
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "has-changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-changes=false" >> "$GITHUB_OUTPUT"
          echo "Spec and config already match ${{ inputs.config-repo }}@main; nothing to publish."
        fi

    - name: Commit and force-push the spec update branch
      if: steps.changes.outputs.has-changes == 'true'
      shell: bash
      working-directory: ${{ steps.clone.outputs.dir }}
      env:
        BRANCH: ${{ inputs.source }}-spec-update
        SUBJECT: 'feat: update ${{ inputs.spec-label }} spec to ${{ github.ref_name }}'
      run: |
        git checkout -q -b "$BRANCH"
        git commit -q -am "$SUBJECT"
        # Force-push: a newer release supersedes any still-open spec PR,
        # including review fixes pushed to it — land those before the next
        # release.
        git push --force --quiet origin "$BRANCH"

    - name: Open or refresh the PR; auto-merge only if the config is unchanged
      if: steps.changes.outputs.has-changes == 'true'
      id: pr
      shell: bash
      working-directory: ${{ steps.clone.outputs.dir }}
      env:
        GH_TOKEN: ${{ inputs.stlc-repo-token }}
        REPO: ${{ inputs.config-repo }}
        BRANCH: ${{ inputs.source }}-spec-update
        TITLE: 'feat: update ${{ inputs.spec-label }} spec to ${{ github.ref_name }}'
        SOURCE_REPO: ${{ github.repository }}
        RELEASE: ${{ github.ref_name }}
        CONFIG_PATH: ${{ inputs.workspace }}/${{ steps.autoconfig.outputs.config-file }}
        CONFIG_CHANGED: ${{ steps.autoconfig.outputs.changed }}
        NON_ADDITIVE: ${{ steps.autoconfig.outputs.non-additive }}
        AUTOCONFIG_SUMMARY: ${{ steps.autoconfig.outputs.summary }}
      run: |
        body="$RUNNER_TEMP/pr-body.md"
        echo "Automated spec publish from ${SOURCE_REPO} release (${RELEASE}). Merging triggers stlc codegen for the SDKs and the docs spec PR." > "$body"
        if [ "$CONFIG_CHANGED" = "true" ]; then
          {
            echo
            echo '## Stainless config changes (`stlc autoconfig`)'
            echo
            echo "This spec has endpoints that were not in \`${CONFIG_PATH}\`. autoconfig added mappings for them (endpoints in \`unspecified_endpoints\` are pruned first), so the config diff is part of this PR. **Auto-merge is off for this PR**: review the config diff and merge it manually."
            echo
            echo "New methods, as autoconfig named them:"
            echo '```'
            printf '%s\n' "$AUTOCONFIG_SUMMARY"
            echo '```'
          } >> "$body"
          cat >> "$body" <<'MD'

        Review checklist:
        - Method and resource names become public API in every SDK and can't be renamed later without a breaking change. Rename them on this branch if the guessed names don't fit the existing style.
        - A `models:` entry for a schema the SDKs already ship renames its generated types (breaking for typed consumers). Drop it, or retitle this PR `feat!:` so release-please cuts a major version.
        - To keep an endpoint out of the SDKs, move it to `unspecified_endpoints`.
        - Push fixes to this branch before the next release: each release recreates the branch from `main`.
        MD
          if [ "$NON_ADDITIVE" = "true" ]; then
            cat >> "$body" <<'MD'

        > [!WARNING]
        > The config diff is **not purely additive**: existing lines were removed or rewritten. autoconfig only adds mappings, so a guessed name most likely collided with an existing method and replaced its endpoint. Check every removed line before merging.
        MD
          fi
        fi

        pr_number=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
        if [ -z "$pr_number" ]; then
          gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$TITLE" --body-file "$body"
        else
          echo "PR #$pr_number already open for $BRANCH — refreshing it for this release"
          gh pr edit "$pr_number" --repo "$REPO" --title "$TITLE" --body-file "$body"
        fi
        echo "pr-url=$(gh pr view "$BRANCH" --repo "$REPO" --json url --jq .url)" >> "$GITHUB_OUTPUT"

        if [ "$CONFIG_CHANGED" = "true" ]; then
          # Hands off: a human reviews the new mappings before this merges
          # (the config repo's CODEOWNERS requests the owning team). Also
          # disarm auto-merge left over from an earlier, spec-only refresh of
          # the same PR.
          gh pr merge "$BRANCH" --repo "$REPO" --disable-auto 2>/dev/null || true
          echo "auto-merge=held" >> "$GITHUB_OUTPUT"
          echo "::notice::Stainless config changed in this release; the spec PR is left for review (auto-merge disabled)."
          exit 0
        fi
        # Hands-off merge, squash-only. The config repo's required check
        # ("generate / generate") gates it: --auto arms and GitHub completes the
        # squash once it passes. Fallback: if nothing blocks the merge (arming
        # fails with "clean status", e.g. the required check was removed),
        # merge directly.
        if gh pr merge "$BRANCH" --repo "$REPO" --auto --squash; then
          echo "auto-merge=armed" >> "$GITHUB_OUTPUT"
        elif gh pr merge "$BRANCH" --repo "$REPO" --squash; then
          echo "auto-merge=merged" >> "$GITHUB_OUTPUT"
        else
          echo "auto-merge=failed" >> "$GITHUB_OUTPUT"
          echo "::warning::Could not arm auto-merge or merge the spec PR — merge it manually on $REPO to trigger codegen."
        fi
